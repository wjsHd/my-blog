<style>
  :root{
    --grad:linear-gradient(135deg,#6fcf97 0%,#3fb491 100%);
    --grad-soft:linear-gradient(135deg,#9ee5bd 0%,#7fd9b4 100%);
    --accent:#34a578;--accent2:#3fb491;--accent-ink:#1f7a5a;
    --soft:rgba(52,165,120,.12);--soft2:rgba(63,180,145,.12);
    --text:#243a31;--muted:#8aa399;
    --glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.80);
    --glass-border:rgba(255,255,255,.75);
    --field:rgba(255,255,255,.55);
    --ring:rgba(52,165,120,.28);
    --shadow:0 10px 40px -16px rgba(40,130,95,.32);
    --radius:26px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --grad:linear-gradient(135deg,#5cc9a0 0%,#37b58f 100%);
      --grad-soft:linear-gradient(135deg,#7fd9b4 0%,#5cc9a0 100%);
      --accent:#5cc9a0;--accent2:#37b58f;--accent-ink:#a7e8c9;
      --text:#e6f1ea;--muted:#83a195;
      --glass:rgba(26,38,32,.55);--glass-strong:rgba(32,46,40,.7);
      --glass-border:rgba(255,255,255,.08);
      --field:rgba(255,255,255,.06);
      --soft:rgba(92,201,160,.16);--soft2:rgba(55,181,143,.14);
      --ring:rgba(92,201,160,.35);
      --shadow:0 10px 40px -14px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{
    min-height:100%;
    background:
      radial-gradient(at 18% 12%, #c7f0d8 0px, transparent 48%),
      radial-gradient(at 85% 8%, #d8f3e3 0px, transparent 46%),
      radial-gradient(at 78% 82%, #bfe9da 0px, transparent 48%),
      radial-gradient(at 12% 92%, #eaf6d2 0px, transparent 44%),
      #f0f9f3;
    background-attachment:fixed;
  }
  @media (prefers-color-scheme:dark){
    html{
      background:
        radial-gradient(at 18% 12%, #1c3d31 0px, transparent 50%),
        radial-gradient(at 85% 8%, #173a34 0px, transparent 48%),
        radial-gradient(at 78% 82%, #12303a 0px, transparent 50%),
        radial-gradient(at 12% 92%, #2a331a 0px, transparent 46%),
        #0b110e;
      background-attachment:fixed;
    }
  }
  body{margin:0 auto;max-width:540px;background:transparent;color:var(--text);line-height:1.55;
    font-family:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:24px;}
  header{
    margin:14px 14px 16px;padding:22px 24px;border-radius:30px;
    background:var(--grad);color:#fff;position:relative;
    box-shadow:0 16px 40px -16px rgba(40,150,110,.55);
    display:flex;align-items:center;justify-content:space-between;
    overflow:hidden;
  }
  header::after{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;
    background:rgba(255,255,255,.18);border-radius:50%;filter:blur(6px);}
  header .title{position:relative;z-index:1;}
  header .title h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.3px;}
  header .title .sub{font-size:12.5px;opacity:.92;margin-top:3px;font-weight:500;}
  header .right{position:relative;z-index:1;display:flex;gap:10px;align-items:center;}
  header .right a{color:#fff;cursor:pointer;border:1.5px solid rgba(255,255,255,.55);
    padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;}
  header .right a:hover{background:rgba(255,255,255,.18);}
  .wrap{padding:0 14px;}
  .card{background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
    border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;
    border:1px solid var(--glass-border);}
  textarea{width:100%;border:1.5px solid transparent;border-radius:16px;padding:14px;font-size:16px;
    font-family:inherit;resize:vertical;min-height:88px;outline:none;background:var(--field);color:var(--text);
    transition:.18s;}
  textarea::placeholder{color:var(--muted);}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring);background:var(--glass-strong);}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:13px;}
  .moods{display:flex;gap:8px;flex-wrap:wrap;}
  .mood-btn{border:1.5px solid transparent;background:var(--field);border-radius:50%;width:44px;height:44px;
    font-size:21px;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;}
  .mood-btn:hover{transform:translateY(-2px);}
  .mood-btn.active{background:var(--soft);border-color:var(--accent);transform:scale(1.13);
    box-shadow:0 6px 16px -5px var(--ring);}
  .tag-input{flex:1;min-width:150px;border:1.5px solid transparent;border-radius:14px;padding:12px 15px;
    font-size:14px;outline:none;background:var(--field);color:var(--text);transition:.18s;}
  .tag-input::placeholder{color:var(--muted);}
  .tag-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring);background:var(--glass-strong);}
  .btns{display:flex;gap:11px;margin-top:15px;}
  button.primary{flex:1;background:var(--grad);color:#fff;border:none;border-radius:16px;padding:14px;
    font-size:16px;font-weight:800;cursor:pointer;letter-spacing:1px;
    box-shadow:0 12px 24px -10px var(--accent);transition:.16s;}
  button.primary:hover{transform:translateY(-2px);box-shadow:0 16px 28px -10px var(--accent2);}
  button.primary:active{transform:translateY(0);}
  .hint{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.5;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head .nav{display:flex;gap:6px;align-items:center;}
  .cal-head button{border:1.5px solid transparent;background:var(--field);border-radius:12px;width:36px;height:36px;
    font-size:17px;cursor:pointer;color:var(--text);transition:.15s;}
  .cal-head button:hover{border-color:var(--accent);color:var(--accent);}
  .cal-title{font-size:18px;font-weight:800;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-grid .wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-weight:700;}
  .day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:14px;
    cursor:pointer;position:relative;color:var(--text);background:transparent;transition:.16s;font-weight:600;}
  .day:not(.empty):hover{background:var(--soft);}
  .day.empty{cursor:default;}
  .day.has{background:var(--grad);color:#fff;font-weight:800;box-shadow:0 6px 16px -6px var(--accent);}
  .day.has.light{background:var(--soft2);color:var(--accent-ink);box-shadow:none;}
  .day.today{outline:2.5px solid var(--accent);outline-offset:-2.5px;}
  .day.sel{box-shadow:0 0 0 3px var(--accent-ink);}
  .day .cnt{position:absolute;bottom:3px;right:6px;font-size:9px;opacity:.95;font-weight:700;}
  .day.has.light .cnt{color:var(--accent-ink);}
  .cal-tip{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;font-weight:500;}
  .legend{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;gap:16px;align-items:center;justify-content:center;}
  .legend i{display:inline-block;width:13px;height:13px;border-radius:5px;vertical-align:middle;margin-right:5px;}
  .day-title{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .day-title .c{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .entry{background:var(--field);border-radius:18px;padding:13px 15px;margin-bottom:12px;position:relative;
    border:1px solid var(--glass-border);}
  .entry:last-child{margin-bottom:0;}
  .entry .meta{font-size:12px;color:var(--muted);margin-bottom:5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .entry .meta .mood-ic{font-size:16px;}
  .entry .txt{font-size:15px;white-space:pre-wrap;word-break:break-word;}
  .entry .tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;}
  .entry .tag{font-size:11px;background:var(--soft);color:var(--accent-ink);padding:3px 10px;border-radius:20px;font-weight:600;}
  .entry .del{margin-left:auto;color:#ef4444;font-size:12px;cursor:pointer;background:none;border:none;opacity:.65;font-weight:600;}
  .entry .del:hover{opacity:1;}
  .empty-day{color:var(--muted);font-size:14px;text-align:center;padding:26px 0;}
  .more-btn{width:100%;border:1px dashed var(--glass-border);background:transparent;border-radius:14px;
    padding:10px;font-size:13px;color:var(--accent-ink);cursor:pointer;margin-bottom:12px;font-weight:600;transition:.15s;}
  .more-btn.less{margin-bottom:0;margin-top:2px;}
  .more-btn:hover{background:var(--soft);}
  .tools{display:flex;gap:11px;}
  .tools button{flex:1;border:1.5px solid transparent;background:var(--field);border-radius:16px;padding:12px;
    font-size:13.5px;cursor:pointer;color:var(--text);transition:.15s;font-weight:600;}
  .tools button:hover{border-color:var(--accent);color:var(--accent);}
  .syncbar{font-size:12.5px;padding:9px 16px;text-align:center;font-weight:600;margin:0 14px 14px;border-radius:16px;}
  .syncbar.local{background:rgba(254,243,199,.85);color:#854d0e;}
  .syncbar.ok{background:rgba(220,252,231,.85);color:#166534;}
  .syncbar.err{background:rgba(254,226,226,.9);color:#991b1b;}
  @media (prefers-color-scheme:dark){
    .syncbar.local{background:rgba(60,50,20,.7);color:#fde68a;}
    .syncbar.ok{background:rgba(15,50,30,.7);color:#86efac;}
    .syncbar.err{background:rgba(60,22,26,.7);color:#fca5a5;}
  }
  .auth{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:22px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .auth .box{background:var(--glass-strong);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
    border-radius:28px;padding:30px;width:100%;max-width:380px;box-shadow:var(--shadow);border:1px solid var(--glass-border);}
  .auth .logo{font-size:40px;text-align:center;margin-bottom:6px;}
  .auth h2{margin:0 0 4px;font-size:22px;text-align:center;font-weight:800;}
  .auth p{margin:0 0 22px;color:var(--muted);font-size:13px;text-align:center;}
  .auth input{width:100%;border:1.5px solid transparent;border-radius:14px;padding:14px;font-size:15px;
    margin-bottom:11px;outline:none;background:var(--field);color:var(--text);transition:.15s;}
  .auth input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring);}
  .auth button{width:100%;background:var(--grad);color:#fff;border:none;border-radius:14px;padding:14px;
    font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 12px 24px -10px var(--accent);letter-spacing:.5px;}
  .auth .switch{text-align:center;margin-top:17px;font-size:13px;color:var(--accent);cursor:pointer;font-weight:600;}
  .auth .msg{font-size:13px;color:#991b1b;min-height:18px;margin-bottom:10px;text-align:center;}
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>📝 日常记录</h1>
    <div class="sub" id="stat">开始记录吧</div>
  </div>
  <div class="right"><a id="logout" style="display:none">退出</a></div>
</header>
<div class="syncbar" id="syncbar" style="display:none"></div>

<div class="wrap">
  <div class="card">
    <textarea id="input" placeholder="此刻做了什么？想说点什么…（点输入法的麦克风也能语音输入）"></textarea>
    <div class="row"><div class="moods" id="moods"></div></div>
    <div class="row"><input class="tag-input" id="tags" placeholder="标签，逗号或空格分隔（可选），如：工作 运动"></div>
    <div class="btns">
      <button class="primary" id="save">记一条</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="card">
    <div class="cal-head">
      <span class="cal-title" id="calTitle"></span>
      <div class="nav">
        <button id="prev">‹</button>
        <button id="todayBtn" style="width:auto;padding:0 13px;font-size:13px;font-weight:700;">今天</button>
        <button id="next">›</button>
      </div>
    </div>
    <div class="cal-grid" id="cal"></div>
    <div class="legend">
      <span><i style="background:var(--grad)"></i>记过</span>
      <span><i style="background:var(--soft2)"></i>记得少</span>
      <span><i style="outline:2px solid var(--accent);background:transparent"></i>今天</span>
    </div>
    <div class="cal-tip">👆 点某一天，下面就能看那天记了啥</div>
  </div>

  <div class="card" id="dayCard">
    <div class="day-title"><span id="dayLabel">今天</span><span class="c" id="dayCount"></span></div>
    <div id="entries"></div>
  </div>

  <div class="card tools">
    <button id="export">⬇️ 导出备份</button>
    <button id="import">⬆️ 导入</button>
    <input type="file" id="file" accept="application/json" style="display:none;">
  </div>
</div>

<div class="auth" id="auth">
  <div class="box">
    <div class="logo">📝</div>
    <h2 id="authTitle">登录</h2>
    <p>用同一个账号登录手机和电脑，记录自动同步。</p>
    <div class="msg" id="authMsg"></div>
    <input id="email" type="email" placeholder="邮箱" autocomplete="username">
    <input id="pwd" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
    <button id="authBtn">登录</button>
    <div class="switch" id="authSwitch">没有账号？去注册</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<scr'+'ipt src="https://unpkg.com/@supabase/supabase-js@2"><\/scr'+'ipt>');}</script>
<script>if(!window.supabase){document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"><\/scr'+'ipt>');}</script>
<script>
const KEY='daily_records_v1', PKEY='daily_records_pending', TABLE='daily_entries';
const MOODS=['😀','🙂','😐','😕','😣','💪','😴'];
const WEEK=['周日','周一','周二','周三','周四','周五','周六'];
let store=load();
let selMood='', selDate=todayStr();
let expandedDate=null; const DAY_LIMIT=5;
let viewYear, viewMonth;
const v=new Date(); viewYear=v.getFullYear(); viewMonth=v.getMonth();

const CLOUD = window.SUPABASE_URL && !String(window.SUPABASE_URL).includes('PASTE_') &&
              window.SUPABASE_ANON_KEY && !String(window.SUPABASE_ANON_KEY).includes('PASTE_');
let sb=null, user=null;
if(CLOUD && window.supabase){ sb=window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY); }

function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};} }
function persist(){ localStorage.setItem(KEY, JSON.stringify(store)); }
function loadPending(){ try{return JSON.parse(localStorage.getItem(PKEY))||[];}catch(e){return [];} }
function savePending(p){ localStorage.setItem(PKEY, JSON.stringify(p)); }
function todayStr(){ return fmt(new Date()); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekdayOf(ds){ const [y,m,d]=ds.split('-').map(Number); return WEEK[new Date(y,m-1,d).getDay()]; }
function uid(){ return (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)); }

const moodsEl=document.getElementById('moods');
MOODS.forEach(m=>{const b=document.createElement('button');b.className='mood-btn';b.textContent=m;
  b.onclick=()=>{selMood=(selMood===m)?'':m;renderMoods();};moodsEl.appendChild(b);});
function renderMoods(){[...moodsEl.children].forEach(b=>b.classList.toggle('active',b.textContent===selMood));}

document.getElementById('save').onclick=saveEntry;
function saveEntry(){
  const txt=document.getElementById('input').value.trim();
  const tagsRaw=document.getElementById('tags').value.trim();
  if(!txt && !selMood){ alert('写点东西或选个心情再记吧～'); return; }
  const tags=tagsRaw?tagsRaw.split(/[,，\s]+/).filter(Boolean):[];
  const now=new Date(); const d=todayStr();
  const entry={id:uid(),date:d,time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),text:txt,mood:selMood,tags};
  (store[d]=store[d]||[]).push(entry);
  persist(); cloudAdd(entry);
  document.getElementById('input').value=''; document.getElementById('tags').value='';
  selMood=''; renderMoods();
  selDate=d; viewYear=now.getFullYear(); viewMonth=now.getMonth();
  renderAll();
}

document.getElementById('prev').onclick=()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--;}renderCal();};
document.getElementById('next').onclick=()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++;}renderCal();};
document.getElementById('todayBtn').onclick=()=>{const n=new Date();viewYear=n.getFullYear();viewMonth=n.getMonth();selDate=todayStr();renderAll();};
function renderCal(){
  document.getElementById('calTitle').textContent=viewYear+'年 '+(viewMonth+1)+'月';
  const cal=document.getElementById('cal');cal.innerHTML='';
  ['一','二','三','四','五','六','日'].forEach(w=>{const e=document.createElement('div');e.className='wd';e.textContent=w;cal.appendChild(e);});
  const first=(new Date(viewYear,viewMonth,1).getDay()+6)%7;
  const days=new Date(viewYear,viewMonth+1,0).getDate();
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day empty';cal.appendChild(e);}
  for(let dd=1;dd<=days;dd++){
    const ds=viewYear+'-'+String(viewMonth+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    const e=document.createElement('div');e.className='day';e.textContent=dd;
    const recs=store[ds];
    if(recs&&recs.length){e.classList.add('has');if(recs.length<2)e.classList.add('light');
      const c=document.createElement('span');c.className='cnt';c.textContent=recs.length;e.appendChild(c);}
    if(ds===todayStr())e.classList.add('today');
    if(ds===selDate)e.classList.add('sel');
    e.onclick=()=>{selDate=ds;renderDay();renderCal();
      document.getElementById('dayCard').scrollIntoView({behavior:'smooth',block:'start'});};
    cal.appendChild(e);
  }
}

function renderDay(){
  const recs=store[selDate]||[];
  const isToday=selDate===todayStr();
  document.getElementById('dayLabel').textContent=(isToday?'今天 · ':'')+selDate+' '+weekdayOf(selDate);
  document.getElementById('dayCount').textContent=recs.length?recs.length+' 条':'无记录';
  const box=document.getElementById('entries');box.innerHTML='';
  if(!recs.length){box.innerHTML='<div class="empty-day">这天还没有记录 ✍️</div>';return;}
  const sorted=recs.slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const expanded=(expandedDate===selDate);
  let show=sorted, hidden=0;
  if(!expanded && sorted.length>DAY_LIMIT){ hidden=sorted.length-DAY_LIMIT; show=sorted.slice(hidden); }
  if(hidden>0){
    const more=document.createElement('button');more.className='more-btn';
    more.textContent='▾ 查看更早的 '+hidden+' 条';
    more.onclick=()=>{expandedDate=selDate;renderDay();};
    box.appendChild(more);
  }
  show.forEach(en=>box.appendChild(makeEntryEl(en)));
  if(expanded && sorted.length>DAY_LIMIT){
    const less=document.createElement('button');less.className='more-btn less';
    less.textContent='▴ 收起';
    less.onclick=()=>{expandedDate=null;renderDay();};
    box.appendChild(less);
  }
}
function makeEntryEl(en){
  const el=document.createElement('div');el.className='entry';
  const meta=document.createElement('div');meta.className='meta';
  meta.innerHTML='<span>🕐 '+(en.time||'')+'</span>'+(en.mood?'<span class="mood-ic">'+en.mood+'</span>':'');
  const del=document.createElement('button');del.className='del';del.textContent='删除';
  del.onclick=()=>{if(confirm('删除这条记录？')){
    store[selDate]=(store[selDate]||[]).filter(x=>x.id!==en.id);
    if(!store[selDate].length)delete store[selDate];
    persist();cloudDel(en.id);renderAll();}};
  meta.appendChild(del);el.appendChild(meta);
  if(en.text){const t=document.createElement('div');t.className='txt';t.textContent=en.text;el.appendChild(t);}
  if(en.tags&&en.tags.length){const tg=document.createElement('div');tg.className='tags';
    en.tags.forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent='#'+t;tg.appendChild(s);});el.appendChild(tg);}
  return el;
}

function renderStat(){
  const d=Object.keys(store).length, r=Object.values(store).reduce((s,a)=>s+a.length,0);
  document.getElementById('stat').textContent=d?('已记 '+d+' 天 · '+r+' 条'):'开始记录吧';
}
function renderAll(){renderCal();renderDay();renderStat();}

document.getElementById('export').onclick=()=>{
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='日常记录备份_'+todayStr()+'.json';a.click();
};
document.getElementById('import').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=(e)=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const data=JSON.parse(r.result);
    if(confirm('导入将与现有记录合并，继续？')){
      for(const d in data){const list=data[d]||[];list.forEach(en=>{
        en.id=en.id||uid();en.date=en.date||d;store[d]=store[d]||[];
        if(!store[d].some(x=>x.id===en.id)){store[d].push(en);cloudAdd(en);}
      });}
      persist();renderAll();alert('导入完成');}
  }catch(err){alert('文件格式不对');}};
  r.readAsText(f);
};

document.getElementById('input').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')saveEntry();});

/* ===================== 云同步 ===================== */
const bar=document.getElementById('syncbar');
function setBar(cls,txt){bar.style.display='block';bar.className='syncbar '+cls;bar.textContent=txt;}
function cloudAdd(entry){ if(!sb||!user)return; enqueue({op:'add',row:toRow(entry)}); flush(); }
function cloudDel(id){ if(!sb||!user)return; enqueue({op:'del',id}); flush(); }
function toRow(e){return {id:e.id,date:e.date,time:e.time,text:e.text,mood:e.mood,tags:e.tags||[]};}
function enqueue(item){const p=loadPending();p.push(item);savePending(p);}

let flushing=false;
async function flush(){
  if(!sb||!user||flushing)return;
  let p=loadPending();if(!p.length)return;
  flushing=true;
  try{
    while(p.length){
      const it=p[0];
      if(it.op==='add'){const {error}=await sb.from(TABLE).upsert({...it.row,user_id:user.id});if(error)throw error;}
      else if(it.op==='del'){const {error}=await sb.from(TABLE).delete().eq('id',it.id);if(error)throw error;}
      p.shift();savePending(p);
    }
    setBar('ok','已同步 ✓');setTimeout(()=>{if(loadPending().length===0)bar.style.display='none';},1500);
  }catch(err){setBar('err','同步失败，已暂存本地，联网后会自动重试');console.error(err);}
  finally{flushing=false;}
}

async function pullDown(){
  if(!sb||!user)return;
  setBar('ok','正在同步…');
  const {data,error}=await sb.from(TABLE).select('*');
  if(error){setBar('err','拉取失败：'+error.message);return;}
  const cloud={};
  (data||[]).forEach(r=>{const d=r.date;(cloud[d]=cloud[d]||[]).push({id:r.id,date:d,time:r.time,text:r.text,mood:r.mood,tags:r.tags||[]});});
  const pendingAddIds=new Set(loadPending().filter(x=>x.op==='add').map(x=>x.row.id));
  for(const d in store){(store[d]||[]).forEach(en=>{
    if(pendingAddIds.has(en.id)){(cloud[d]=cloud[d]||[]);if(!cloud[d].some(x=>x.id===en.id))cloud[d].push(en);}
  });}
  store=cloud;persist();renderAll();
  setBar('ok','已同步 ✓');setTimeout(()=>{if(loadPending().length===0)bar.style.display='none';},1500);
}

const authEl=document.getElementById('auth');
let signupMode=false;
function showAuth(){authEl.style.display='flex';}
function hideAuth(){authEl.style.display='none';}
document.getElementById('authSwitch').onclick=()=>{
  signupMode=!signupMode;
  document.getElementById('authTitle').textContent=signupMode?'注册':'登录';
  document.getElementById('authBtn').textContent=signupMode?'注册':'登录';
  document.getElementById('authSwitch').textContent=signupMode?'已有账号？去登录':'没有账号？去注册';
  document.getElementById('authMsg').textContent='';
};
document.getElementById('authBtn').onclick=async()=>{
  const email=document.getElementById('email').value.trim();
  const pwd=document.getElementById('pwd').value;
  const msg=document.getElementById('authMsg');
  if(!email||pwd.length<6){msg.textContent='请输入邮箱和至少 6 位密码';return;}
  msg.style.color='var(--muted)';msg.textContent='处理中…';
  try{
    if(signupMode){const {error}=await sb.auth.signUp({email,password:pwd});if(error)throw error;
      msg.style.color='#166534';msg.textContent='注册成功，正在登录…';}
    else{const {error}=await sb.auth.signInWithPassword({email,password:pwd});if(error)throw error;}
  }catch(err){msg.style.color='#991b1b';msg.textContent=translate(err.message);}
};
document.getElementById('logout').onclick=async()=>{ if(sb){await sb.auth.signOut();location.reload();} };
function translate(m){
  if(/Invalid login/.test(m))return '邮箱或密码不对';
  if(/already registered/.test(m))return '该邮箱已注册，请直接登录';
  if(/Email not confirmed/.test(m))return '邮箱未验证（可在 Supabase 后台关闭邮箱验证）';
  return m;
}

async function initCloud(){
  document.getElementById('logout').style.display='inline';
  const {data}=await sb.auth.getSession();
  user=data.session?data.session.user:null;
  sb.auth.onAuthStateChange((_e,session)=>{
    user=session?session.user:null;
    if(user){hideAuth();flush().then(pullDown);}else showAuth();
  });
  if(user){hideAuth();await flush();await pullDown();}else showAuth();
  window.addEventListener('online',()=>{if(user)flush().then(pullDown);});
}

function start(){
  if(CLOUD && sb){
    document.getElementById('hint').textContent='已开启云同步，手机电脑用同一账号登录即可互通。没网也能记，联网自动补传。';
    renderAll(); initCloud();
  }else if(CLOUD && !sb){
    setBar('err','已填写配置，但同步库没加载成功（多半是网络/CDN 被拦）。检查网络后刷新即可；这期间记录会先存本地，不会丢。');
    document.getElementById('hint').textContent='同步库加载失败，暂为本地模式。';
    renderAll();
  }else{
    setBar('local','本地模式：数据只存这台设备的浏览器，记得偶尔「导出备份」。填入 Supabase 配置后即可开启同步。');
    document.getElementById('hint').textContent='当前为本地模式，数据只存在本机浏览器。';
    renderAll();
  }
}
start();
</script>
